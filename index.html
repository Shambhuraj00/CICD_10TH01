<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSwap Pro — Trade skills, not tuition</title>
  <meta name="description" content="The student skill exchange. Teach what you know, learn what you need. Match, chat, and swap." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="#home" class="logo" data-route="home">Skill<span>Swap</span><sup>pro</sup></a>
      <nav class="primary-nav">
        <a href="#home" data-route="home">Home</a>
        <a href="#browse" data-route="browse">Browse</a>
        <a href="#exchanges" data-route="exchanges">Exchanges <span id="badge-exchanges" class="badge hidden">0</span></a>
        <a href="#chat" data-route="chat">Chat</a>
      </nav>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
        <button class="btn btn-primary" data-route="post">Post a skill</button>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <!-- Modal -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close aria-label="Close">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <footer>
    <div class="container footer-grid">
      <div>
        <p class="logo">Skill<span>Swap</span></p>
        <p class="muted small">Built by students, for students.</p>
      </div>
      <div>
        <p class="footer-title">Explore</p>
        <a href="#browse" data-route="browse">Browse</a>
        <a href="#exchanges" data-route="exchanges">Exchanges</a>
      </div>
      <div>
        <p class="footer-title">Account</p>
        <a href="#post" data-route="post">Post a skill</a>
        <a href="#profile" data-route="profile">My profile</a>
      </div>
    </div>
    <p class="copyright">© <span id="year"></span> SkillSwap Pro</p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
